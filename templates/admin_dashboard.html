<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard - FoodConnect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
      .admin-wrap{max-width:1000px;margin:40px auto;padding:24px}
      .admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:24px 0}
      .admin-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:22px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
      .admin-card strong{display:block;font-size:30px;margin-top:8px;color:#1f2937}
      .admin-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
      .admin-actions a{display:inline-block;padding:12px 18px;border-radius:8px;text-decoration:none;background:#166534;color:white}
      .admin-actions a.secondary{background:#374151}
    </style>
</head>
<body>
  <main class="admin-wrap">
    <h1>FoodConnect Admin Dashboard</h1>
    <p>Overview of the current application data.</p>
    <section class="admin-grid">
      <div class="admin-card">Registered users<strong>{{ user_count }}</strong></div>
      <div class="admin-card">Restaurants<strong>{{ restaurant_count }}</strong></div>
      <div class="admin-card">Food items<strong>{{ food_count }}</strong></div>
      <div class="admin-card">Reviews<strong>{{ review_count }}</strong></div>
    </section>
    <nav class="admin-actions">
      <a href="{{ url_for('admin_reports') }}">Monthly Reports</a>
      <a class="secondary" href="{{ url_for('restaurants') }}">Manage / View Restaurants</a>
      <a class="secondary" href="{{ url_for('dashboard') }}">User Dashboard</a>
      <a class="secondary" href="{{ url_for('logout') }}">Logout</a>
    </nav>
  </main>
</body>
</html>
