<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - FoodConnect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <h2>Welcome, {{ username }}! 🎉</h2>
        <p>You are successfully logged in to FoodConnect.</p>
        {% if is_admin %}<a href="/admin" class="btn-primary" style="display:inline-block; width:auto; padding:12px 28px; text-decoration:none; margin-right:10px;">Admin Panel</a>{% endif %}
        <a href="/restaurants" class="btn-primary" style="display:inline-block; width:auto; padding:12px 28px; text-decoration:none; margin-right:10px;">Browse Restaurants</a>
        <a href="/logout" class="btn-logout">Logout</a>
    </div>
</body>
</html>
